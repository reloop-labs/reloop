name: reloop-local

services:
  reloop-postgres:
    image: postgres:17-alpine
    container_name: reloop-postgres
    volumes:
      - ../docker-data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: reloop
      POSTGRES_USER: reloop
      POSTGRES_PASSWORD: reloop123
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "log_statement=all"]
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      test: ["CMD", "pg_isready", "-U", "reloop", "-d", "reloop"]
    restart: unless-stopped

  reloop-redis:
    image: redis:7-alpine
    container_name: reloop-redis
    command: redis-server --requirepass reloop123
    volumes:
      - ../docker-data/redis:/data
    ports:
      - "6379:6379"
    restart: unless-stopped


  reloop-proxy:
    image: caddy:2-alpine
    container_name: reloop-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../docker-data/caddy:/data
      - ../docker-data/caddy:/config
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  reloop-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: reloop-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ../docker-data/clickhouse:/var/lib/clickhouse
      - ./grafana/config/clickhouse-config.xml:/etc/clickhouse-server/config.xml
    environment:
      CLICKHOUSE_DB: reloop_analytics
      CLICKHOUSE_USER: reloop
      CLICKHOUSE_PASSWORD: reloop123
    command: ["clickhouse-server", "--config-file=/etc/clickhouse-server/config.xml"]
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
    restart: unless-stopped

  reloop-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: reloop-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./grafana/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter metrics
    depends_on:
      - reloop-clickhouse
    restart: unless-stopped
  reloop-grafana:
    image: grafana/grafana:10.4.0
    container_name: reloop-grafana
    ports:
      - "3400:3000"
    volumes:
      - ../docker-data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: reloop123
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    depends_on:
      - reloop-clickhouse
    restart: unless-stopped

  # Optional: Loki for log aggregation
  reloop-loki:
    image: grafana/loki:2.9.0
    container_name: reloop-loki
    ports:
      - "3100:3100"
    volumes:
      - ../docker-data/loki:/loki
      - ./grafana/config/loki-config.yaml:/etc/loki/local-config.yaml
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped
