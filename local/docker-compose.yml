name: reloop-local

services:
  reloop-postgres:
    image: postgres:17-alpine
    container_name: reloop-postgres
    volumes:
      - ../docker-data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: reloop
      POSTGRES_USER: reloop
      POSTGRES_PASSWORD: reloop123
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "log_statement=all"]
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      test: ["CMD", "pg_isready", "-U", "reloop", "-d", "reloop"]
    restart: unless-stopped

  reloop-redis:
    image: redis:7-alpine
    container_name: reloop-redis
    command: redis-server --requirepass reloop123
    volumes:
      - ../docker-data/redis:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  reloop-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: reloop-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ../docker-data/clickhouse:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: reloop
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: reloop123
      CLICKHOUSE_USER: default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  reloop-proxy:
    image: caddy:2-alpine
    container_name: reloop-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs
      - ../docker-data/caddy:/data
      - ../docker-data/caddy:/config
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  reloop-mailpit:
    image: axllent/mailpit:latest
    container_name: reloop-mailpit
    ports:
      - "1025:1025"  # SMTP port for sending test emails
      - "8025:8025"  # Web UI port for viewing captured emails
    environment:
      MP_ENABLE_CHAOS: "true"
    restart: unless-stopped

  kumomta-smtp:
    build:
      context: ../apps/backend/kumomta-smtp
      dockerfile: Dockerfile
    container_name: kumomta-smtp
    ports:
      - "25:25"      # ESMTP injection
      - "8020:8000"  # HTTP API
    volumes:
      - ../docker-data/kumomta/data:/var/spool/kumomta/data
      - ../docker-data/kumomta/meta:/var/spool/kumomta/meta
      - ../apps/backend/kumomta-smtp/init.lua:/opt/kumomta/etc/policy/init.lua
      - ../apps/backend/kumomta-smtp/policy:/opt/kumomta/etc/policy/policy
    environment:
      - BASE_URL=${BASE_URL:-https://local.reloop.sh}
      - NATS_URL=${NATS_URL:-reloop-nats:4222}
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      reloop-mailpit:
        condition: service_started
    restart: unless-stopped

  reloop-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: reloop-minio
    ports:
      - "9010:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: reloop
      MINIO_ROOT_PASSWORD: reloop123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  reloop-nats:
    image: nats:2.10-alpine
    container_name: reloop-nats
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring port
    command: "-js" # Enable JetStream for persistence
    restart: unless-stopped


