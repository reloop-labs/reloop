name: Supabase integration

on:
  pull_request:
    paths:
      - integrations/supabase/**
      - packages/db/src/client.ts
      - packages/db/src/connection-options.ts
      - packages/db/test/connection-options.test.ts
      - packages/db/drizzle.config.ts
      - turbo.json
      - .github/workflows/supabase-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Test database connection settings
        run: bun test packages/db/test/connection-options.test.ts
      - name: Test signed Auth hooks
        working-directory: integrations/supabase/supabase/functions/reloop-send-email
        run: bunx deno@2.1.4 test --config deno.json handler_test.ts
      - name: Type-check the Edge Function
        working-directory: integrations/supabase/supabase/functions/reloop-send-email
        run: bunx deno@2.1.4 check --config deno.json index.ts
