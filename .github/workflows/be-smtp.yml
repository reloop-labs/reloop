name: BE SMTP Docker

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/smtp/**'
      - '.github/workflows/be-smtp.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/backend/smtp/**'
      - '.github/workflows/be-smtp.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/be-smtp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend/smtp
          file: ./apps/backend/smtp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
      - name: Trigger Coolify Deploy
        if: github.event_name != 'pull_request'
        run: |
          curl --fail -i -X GET "https://coolify.reloop.sh/api/v1/deploy?uuid=k98bskknpear19vezb1mfw0x&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

