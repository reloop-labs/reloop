name: Initial Docker Push

on:
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build_all_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/web-service:latest

      - name: Build and push admin image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.admin
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/admin-service:latest

      - name: Build and push docs image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.docs
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/docs-service:latest

      - name: Build and push dev image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.dev
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/dev-service:latest
