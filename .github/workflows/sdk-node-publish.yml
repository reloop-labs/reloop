# SDK Node.js Publish Workflow
#
# This workflow automatically builds and publishes the reloop-email package to npm.
#
# Prerequisites:
# 1. Create an npm access token:
#    - Go to https://www.npmjs.com/settings/<your-username>/tokens
#    - Click "Generate New Token" → "Automation"
#    - Copy the token
# 2. Add the token as a GitHub secret:
#    - Go to your GitHub repository → Settings → Secrets and variables → Actions
#    - Click "New repository secret"
#    - Name: NPM_TOKEN
#    - Value: Paste your npm token
#    - Click "Add secret"
#
# The workflow will trigger on:
# - Push to main branch when files in sdk/node/** change
# - Manual trigger via workflow_dispatch

name: SDK Node.js Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'sdk/node/**'
      - '.github/workflows/sdk-node-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ./sdk/node
        run: npm install

      - name: Build package
        working-directory: ./sdk/node
        run: npm run build

      - name: Publish to npm
        working-directory: ./sdk/node
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

