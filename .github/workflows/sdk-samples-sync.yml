name: SDK samples sync

on:
  pull_request:
    paths:
      - "packages/code-samples/**"
      - "apps/frontend/dashboard/src/components/api-details/api-keys-code-examples.ts"
      - "apps/frontend/dashboard/src/features/onboarding/step4/snippets.ts"
      - "apps/frontend/docs/content/docs/api/**"
      - "apps/frontend/docs/scripts/**"
      - "scripts/**"
      - ".github/workflows/sdk-samples-sync.yml"
  push:
    branches:
      - main
    paths:
      - "packages/code-samples/**"
      - "apps/frontend/dashboard/src/components/api-details/api-keys-code-examples.ts"
      - "apps/frontend/dashboard/src/features/onboarding/step4/snippets.ts"
      - "apps/frontend/docs/content/docs/api/**"
      - "apps/frontend/docs/scripts/**"
      - "scripts/**"
      - ".github/workflows/sdk-samples-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Samples in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check dashboard + docs match @reloop/code-samples
        run: bun run sync:sdk-samples:check
