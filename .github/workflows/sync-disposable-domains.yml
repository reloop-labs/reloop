name: Sync Disposable Domains

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run multi-source catalogue refresh
        run: bun run --filter=@reloop/email-validation refresh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [[ -n "$(git status --porcelain packages/email-validation/data/upstream/)" ]]; then
            git add packages/email-validation/data/upstream/
            git commit -m "chore(email-validation): sync daily disposable domains"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes in disposable domain datasets."
          fi
