name: Sync Disposable Domains

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run multi-source catalogue refresh
        run: bun run --filter=@reloop/email-validation refresh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELOOP_DISPOSABLE_SYNC }}
          commit-message: "chore(email-validation): sync daily disposable domains"
          title: "chore(email-validation): sync daily disposable domains"
          body: |
            Automated daily sync of upstream disposable domain datasets.

            Triggered by scheduled catalogue refresh.
          branch: "automated/sync-disposable-domains"
          delete-branch: true
          add-paths: |
            packages/email-validation/data/upstream/

