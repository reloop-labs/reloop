name: BE MCP Docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'apps/backend/mcp/**'
      - 'packages/auth/**'
      - '.github/workflows/be-mcp.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/backend/mcp/**'
      - 'packages/auth/**'
      - '.github/workflows/be-mcp.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/be-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with local Bun used to generate bun.lock (frozen install fails across major patch skew).
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint MCP server
        run: bun run lint
        working-directory: apps/backend/mcp

      - name: Typecheck MCP server
        run: bun run typecheck
        working-directory: apps/backend/mcp

      - name: Test MCP server
        run: bun run test
        working-directory: apps/backend/mcp

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: apps/backend/mcp
          file: ./apps/backend/mcp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELOOP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

      - name: Trigger Coolify Deploy
        if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        run: |
          curl --fail -i -X POST "https://coolify.reloop.sh/api/v1/deploy?uuid=0x9z0cap542jwrhdpf7z3cev&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      # Coolify answers the trigger before the new container is live. Wait until
      # production reports this commit, so a stale container fails the run
      # instead of silently serving old code.
      - name: Verify production is on this commit
        if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        run: |
          for attempt in $(seq 1 60); do
            live=$(curl -fsS https://reloop.sh/mcp/healthz | jq -r '.commit // "none"' || echo "unreachable")
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "reloop.sh/mcp is on $GITHUB_SHA"
              break
            fi
            echo "attempt $attempt: live commit is $live, waiting for $GITHUB_SHA"
            sleep 10
          done
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error::reloop.sh/mcp is still on $live after 10 minutes, expected $GITHUB_SHA"
            exit 1
          fi
          challenge=$(curl -sS -o /dev/null -D - -X POST https://reloop.sh/mcp -H 'content-type: application/json' -d '{}' | grep -i '^www-authenticate:' || true)
          echo "$challenge"
          case "$challenge" in
            *resource_metadata=*) ;;
            *) echo "::error::/mcp 401 is missing resource_metadata; OAuth clients cannot discover sign-in"; exit 1 ;;
          esac
          curl -fsS https://reloop.sh/.well-known/oauth-protected-resource/mcp | jq -e '.resource and .authorization_servers' > /dev/null
          curl -fsS https://reloop.sh/.well-known/oauth-authorization-server | jq -e '.registration_endpoint' > /dev/null
