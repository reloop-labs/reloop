name: FE Web Docker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/web/**'
      - 'packages/ui/**'
      - 'install/install.sh'
      - '.github/workflows/fe-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:
  pricing_source_of_truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with local Bun used to generate bun.lock (frozen install fails across major patch skew).
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate agent discovery files
        run: bun run generate:agent-public
        working-directory: apps/frontend/web

      - name: Fail if generated pricing surfaces drifted from @reloop/pricing
        run: git diff --exit-code -- apps/frontend/web/public/llms.txt apps/frontend/web/public/pricing.md apps/frontend/web/public/index.md

      - name: Check every pricing surface against the catalog
        run: bun test src/lib/pricing-facts.test.ts
        working-directory: apps/frontend/web

  build_and_publish:
    needs: pricing_source_of_truth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fe-web:latest
      - name: Trigger Coolify Deploy
        if: github.event_name != 'pull_request'
        run: |
          curl --fail -i -X POST "https://coolify.reloop.sh/api/v1/deploy?uuid=e44u9e6koh8xg5q537zj69mi&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

