name: BE IMAP Docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'apps/backend/imap/**'
      - 'packages/db/migrations/0045_imap_mail_store.sql'
      - '.github/workflows/be-imap.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/backend/imap/**'
      - 'packages/db/migrations/0045_imap_mail_store.sql'
      - '.github/workflows/be-imap.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/be-imap

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reloop
          POSTGRES_USER: reloop
          POSTGRES_PASSWORD: reloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reloop -d reloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222

    env:
      PG_URL: postgresql://reloop:reloop@localhost:5432/reloop
      NATS_URL: nats://localhost:4222

    defaults:
      run:
        working-directory: apps/backend/imap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/imap/go.mod
          cache-dependency-path: apps/backend/imap/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o imap .

      - name: Unit tests
        run: go test ./...

      - name: Prepare database
        run: |
          # The mail_* tables reference organization and domain; stub just
          # their primary keys instead of running every migration.
          psql "$PG_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE organization (id text PRIMARY KEY);
          CREATE TABLE domain (id text PRIMARY KEY);
          INSERT INTO organization VALUES ('org_ci');
          INSERT INTO domain VALUES ('domain_ci');
          SQL
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f ../../../packages/db/migrations/0045_imap_mail_store.sql

      - name: Start IMAP server
        run: |
          IMAP_ADDR=127.0.0.1:1143 IMAP_ALLOW_INSECURE_AUTH=true ./imap serve > imap.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:8029/health && exit 0
            sleep 1
          done
          cat imap.log
          exit 1

      - name: End-to-end smoke test
        run: |
          ./imap create-account ci@ci.reloop.sh org_ci domain_ci
          export IMAP_TEST_USER=ci@ci.reloop.sh
          export IMAP_TEST_PASSWORD="$(./imap app-password ci@ci.reloop.sh CI)"
          python3 test/smoke.py

      - name: Server log
        if: always()
        run: cat imap.log || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend/imap
          file: ./apps/backend/imap/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

      # Set the repo variable COOLIFY_IMAP_UUID once the Coolify app exists.
      - name: Trigger Coolify Deploy
        if: github.event_name != 'pull_request' && github.ref_type != 'tag' && vars.COOLIFY_IMAP_UUID != ''
        run: |
          curl --fail -i -X POST "https://coolify.reloop.sh/api/v1/deploy?uuid=${{ vars.COOLIFY_IMAP_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
