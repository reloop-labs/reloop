name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Reloop hostname, such as reloop.example.com
        type: string
        required: true
      admin_email:
        description: TLS certificate contact email
        type: string
        required: true
      ssh_key_ids:
        description: Existing DigitalOcean SSH key IDs, comma-separated
        type: string
        required: true
      region:
        description: DigitalOcean region slug
        type: string
        default: fra1
        required: true
      version:
        description: Published Reloop image tag
        type: string
        default: latest
        required: true
      accept_smtp_limit:
        description: I understand this creates a paid evaluation server with SMTP blocked
        type: boolean
        default: false
        required: true
  pull_request:
    paths:
      - install/digitalocean/**
      - .github/workflows/deploy-digitalocean.yml

permissions:
  contents: read

concurrency:
  group: digitalocean-${{ inputs.domain || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun test install/digitalocean/deploy.test.ts
      - run: bash -n install/digitalocean/bootstrap.sh

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Provision evaluation Droplet
        run: bun install/digitalocean/deploy.ts
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DIGITALOCEAN_SSH_KEY_IDS: ${{ inputs.ssh_key_ids }}
          DIGITALOCEAN_REGION: ${{ inputs.region }}
          RELOOP_DOMAIN: ${{ inputs.domain }}
          RELOOP_ADMIN_EMAIL: ${{ inputs.admin_email }}
          RELOOP_VERSION: ${{ inputs.version }}
          RELOOP_ACCEPT_SMTP_LIMIT: ${{ inputs.accept_smtp_limit }}
