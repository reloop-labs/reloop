name: FE Links Docker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/links/**'
      - 'packages/ui/**'
      - '.github/workflows/fe-links.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push links image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/links/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fe-links:latest
      - name: Trigger Coolify Deploy
        if: github.event_name != 'pull_request'
        run: |
          curl --fail -i -X POST "https://coolify.reloop.sh/api/v1/deploy?uuid=odffkhqpd1m8u8touszzcp31&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

