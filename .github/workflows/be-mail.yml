name: BE Mail Docker

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/mail/**'
      - 'docker-compose.setup.yml'
      - '.github/workflows/be-mail.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/backend/mail/**'
      - 'docker-compose.setup.yml'
      - '.github/workflows/be-mail.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  # Fall back on PRs/forks where Docker Hub secrets are unavailable.
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/be-mail', secrets.DOCKERHUB_USERNAME) || 'local/be-mail' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRs only need a local build; Hub login (and its Node punycode warning)
      # is reserved for push/deploy on main where secrets are available.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/mail/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
      - name: Trigger Coolify Deploy
        if: github.event_name != 'pull_request'
        run: |
          curl --fail -i -X POST "https://coolify.reloop.sh/api/v1/deploy?uuid=boakz1dln4jrodkhm68nul5b&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

