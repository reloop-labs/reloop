  /api/contacts/list:
    get:
      tags:
        - Contact
      summary: List Contacts
      description: Retrieves a paginated list of contacts with optional filtering and search
      security:
        - apiKey: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          in: query
          required: false
          schema:
            minimum: 1
            maximum: 100
            default: 100
            type: number
        - name: search
          in: query
          required: false
          schema:
            description: Search by email
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - subscribed
              - unsubscribed
              - blocked
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    default: contact
                    const: contact
                    type: string
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Unique contact identifier
                          type: string
                        email:
                          description: Contact email address
                          type: string
                        firstName:
                          description: Contact first name
                          anyOf:
                            - type: string
                            - type: "null"
                        lastName:
                          description: Contact last name
                          anyOf:
                            - type: string
                            - type: "null"
                        status:
                          type: string
                          enum:
                            - subscribed
                            - unsubscribed
                            - blocked
                        properties:
                          description: Contact properties as key-value pairs
                          default: {}
                          type: object
                          patternProperties:
                            ^[a-z_]+$:
                              anyOf:
                                - type: string
                                - type: number
                        createdAt:
                          anyOf:
                            - type: Date
                            - format: date-time
                              type: string
                            - format: date
                              type: string
                            - type: number
                        updatedAt:
                          anyOf:
                            - type: Date
                            - format: date-time
                              type: string
                            - format: date
                              type: string
                            - type: number
                      required:
                        - id
                        - email
                        - firstName
                        - lastName
                        - status
                        - properties
                        - createdAt
                        - updatedAt
                  total:
                    type: number
                  page:
                    type: number
                  limit:
                    type: number
                  totalContacts:
                    description: Total number of contacts in organization
                    type: number
                  subscribedContacts:
                    description: Total number of subscribed contacts
                    type: number
                  unsubscribedContacts:
                    description: Total number of unsubscribed contacts
                    type: number
                required:
                  - object
                  - contacts
                  - total
                  - page
                  - limit
                  - totalContacts
                  - subscribedContacts
                  - unsubscribedContacts
        "403":
          description: Response for status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    const: Unauthorized access
                    type: string
                required:
                  - message
      operationId: getApiContactsList
