services:
  kumomta:
    build: .
    container_name: kumomta
    environment:
      # Multi-domain support: comma-separated list of domains
      MAIL_DOMAINS: "example.com,test.example.com,another-domain.com"
      DKIM_SELECTOR: default
    ports:
      - "25:25"
      - "587:587"
    volumes:
      # Persist DKIM keys across container restarts
      - kumomta-dkim-keys:/opt/kumomta/etc/dkim
      # Persist TLS certificates
      - kumomta-tls:/opt/kumomta/etc/tls
    restart: unless-stopped

volumes:
  kumomta-dkim-keys:
  kumomta-tls:
