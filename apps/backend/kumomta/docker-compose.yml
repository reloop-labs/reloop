services:
  kumomta:
    build: .
    container_name: kumomta
    environment:
      # Server-level config
      MAIL_HOSTNAME: "mail.example.com"
      # Mail service API for DB-driven DKIM config
      MAIL_SERVICE_URL: "http://mail-service:8015"
      # Webhook URL for delivery event callbacks
      WEBHOOK_URL: "http://mail-service:8015/api/mail/v1/kumomta/webhook"
    ports:
      - "25:25"
      - "587:587"
      - "8000:8000"
    volumes:
      # Persist TLS certificates
      - kumomta-tls:/opt/kumomta/etc/tls
    restart: unless-stopped

volumes:
  kumomta-tls:
