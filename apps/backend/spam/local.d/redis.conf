{#
  Redis for Bayes / fuzzy / greylist / etc.
  Official image: RSPAMD_* env vars are exposed to Jinja with the prefix stripped.
    RSPAMD_REDIS_SERVERS  → env.REDIS_SERVERS
    RSPAMD_REDIS_PASSWORD → env.REDIS_PASSWORD
#}
{% if env.REDIS_SERVERS %}
servers = "{= env.REDIS_SERVERS =}";
{% else %}
servers = "reloop-redis:6379";
{% endif %}
{% if env.REDIS_PASSWORD %}
password = "{= env.REDIS_PASSWORD =}";
{% else %}
password = "reloop123";
{% endif %}
