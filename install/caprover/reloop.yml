            KUMOMTA_HTTP_URL: http://srv-captain--$$cap_appname-smtp:8000
            KUMOMTA_WEBHOOK_URL: http://srv-captain--$$cap_appname-domain:8011/api/domain
            KUMOMTA_CHECK_RECIPIENT_URL: http://srv-captain--$$cap_appname-domain:8011/api/domain
            KUMOMTA_RSPAMD_URL: http://srv-captain--$$cap_appname-spam:11333/checkv2
            KUMOMTA_MIN_FREE_SPACE: 5%
            KUMOMTA_MIN_FREE_INODES: '0'
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-nats
            - $$cap_appname-spam

caproverOneClickApp:
    variables:
        - id: $$cap_reloop_version
          label: Reloop Version
          defaultValue: latest
          description: Image tag for every Reloop service. Check https://hub.docker.com/r/reloopsh/be-auth/tags for valid tags.
          validRegex: /^([^\s^\/])+$/
        - id: $$cap_reloop_domain
          label: Reloop Domain
          defaultValue: $$cap_appname.$$cap_root_domain
          description: Serves the dashboard and the API. Leave the default unless you will attach a custom domain to the main Reloop app before signing in.
          validRegex: /^[a-z0-9.-]+$/
        - id: $$cap_reloop_links_domain
          label: Tracking Domain
          defaultValue: $$cap_appname-links.$$cap_root_domain
          description: Serves click and open tracking and unsubscribe pages. Must point at the links app (the app name followed by -links).
          validRegex: /^[a-z0-9.-]+$/
        - id: $$cap_reloop_inbound_hostname
          label: Inbound Mail Hostname
          defaultValue: $$cap_appname-inbound.$$cap_root_domain
          description: MX target for mail your verified domains receive. Needs an A record pointing at this server.
          validRegex: /^[a-z0-9.-]+$/
        - id: $$cap_reloop_app_name
          label: Instance Name
          defaultValue: Reloop
          description: Shown in system email as "Self-hosted Reloop × <name>".
          validRegex: /.{1,}/
        - id: $$cap_reloop_sender_domain
          label: System Email Sender Domain
          description: Optional. Domain that sign-in codes and invitations are sent from. Required before the first 7-day session expires.
        - id: $$cap_smtp_host
          label: System Email SMTP Host
          description: Optional. Any SMTP provider you already use, for sign-in codes and invitations.
        - id: $$cap_smtp_port
          label: System Email SMTP Port
          defaultValue: '587'
          validRegex: /^\d+$/
        - id: $$cap_smtp_user
          label: System Email SMTP User
        - id: $$cap_smtp_password
          label: System Email SMTP Password
        - id: $$cap_smtp_secure
          label: System Email SMTP Implicit TLS
          defaultValue: 'false'
          description: Set to true for implicit TLS, normally with port 465.
          validRegex: /^(true|false)$/
        - id: $$cap_s3_endpoint
          label: S3 Endpoint
          description: Optional. S3-compatible storage for template images and attachments. The bucket must serve objects publicly.
        - id: $$cap_s3_access_key
          label: S3 Access Key
        - id: $$cap_s3_secret_key
          label: S3 Secret Key
        - id: $$cap_s3_bucket
          label: S3 Bucket
          defaultValue: reloop-uploads
        - id: $$cap_s3_region
          label: S3 Region
          defaultValue: us-east-1
        - id: $$cap_postgres_password
          label: Postgres Password
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[a-f0-9]{16,}$/
        - id: $$cap_redis_password
          label: Redis Password
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[a-f0-9]{16,}$/
        - id: $$cap_better_auth_secret
          label: Auth Secret
          defaultValue: $$cap_gen_random_hex(64)
          validRegex: /.{32,}/
        - id: $$cap_internal_secret
          label: Internal Service Secret
          defaultValue: $$cap_gen_random_hex(64)
          validRegex: /.{32,}/
        - id: $$cap_tracking_secret
          label: Tracking Secret
          defaultValue: $$cap_gen_random_hex(64)
          description: Changing it later breaks tracked links in mail that was already sent.
          validRegex: /.{32,}/
        - id: $$cap_preferences_secret
          label: Preferences Secret
          defaultValue: $$cap_gen_random_hex(64)
          description: Changing it later breaks unsubscribe links in mail that was already sent.
          validRegex: /.{32,}/
        - id: $$cap_webhook_encryption_key
          label: Webhook Encryption Key
          defaultValue: $$cap_gen_random_hex(64)
          description: 64 hex characters. Changing it later breaks the signature on every existing webhook.
          validRegex: /^[a-f0-9]{64}$/
        - id: $$cap_workbench_password
          label: Queue Dashboard Password
          defaultValue: $$cap_gen_random_hex(32)
          description: Basic auth password for /api/workflow/jobs, user admin.
          validRegex: /.{12,}/
        - id: $$cap_admin_setup_key
          label: Administrator Setup Key
          defaultValue: $$cap_gen_random_hex(64)
          description: Copy this now. You paste it at /dashboard/setup to create the first administrator. It works once.
          validRegex: /.{32,}/
    instructions:
        start: |-
            Reloop is an open-source email platform for transactional mail, campaigns and inbound.

            Before you deploy:
            - The server must be x86_64 with at least 8 GB of RAM and 50 GB of disk.
            - Ports 25, 465 and 587 must be free on the server and open inbound and outbound. Many providers block port 25 until you ask.
            - Copy the Administrator Setup Key below. You need it to create the first administrator.

            The first deploy downloads about 5 GB of images. Full guide: https://reloop.sh/docs/self-host/caprover
        end: |-
            Reloop is deploying. The backend services restart a few times until $$cap_appname-auth has created the database schema.

            Next steps:
            1. Open the $$cap_appname and $$cap_appname-links apps, click Enable HTTPS on each, then turn on Force HTTPS.
            2. Add DNS records: an A record for $$cap_reloop_inbound_hostname and an SPF TXT record "v=spf1 ip4:<server ip> -all" on $$cap_reloop_domain.
            3. Open https://$$cap_reloop_domain/dashboard/setup and paste the Administrator Setup Key.

            Full guide: https://reloop.sh/docs/self-host/caprover
    displayName: Reloop
    isOfficial: false
    description: Open-source email platform for transactional mail, campaigns and inbound, with its own MTA, tracking and webhooks.
    documentation: https://reloop.sh/docs/self-host/caprover
