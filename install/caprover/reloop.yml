captainVersion: 4

services:
    $$cap_appname:
        caproverExtra:
            containerHttpPort: '80'
            dockerfileLines:
                - FROM caddy:2-alpine
                - RUN printf '%s\n' \
                - "'{' \\"
                - "'    auto_https off' \\"
                - "'    servers {' \\"
                - "'        trusted_proxies static private_ranges' \\"
                - "'    }' \\"
                - "'}' \\"
                - "'' \\"
                - "'http:// {' \\"
                - "'    encode zstd gzip' \\"
                - "'' \\"
                - "'    handle /dashboard* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-dashboard:3000' \\"
                - "'    }' \\"
                - "'    handle /docs* {' \\"
                - "'        redir https://reloop.sh{uri} 302' \\"
                - "'    }' \\"
                - "'    handle /preferences* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-links:3005' \\"
                - "'    }' \\"
                - "'    handle /redirect* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-links:3005' \\"
                - "'    }' \\"
                - "'    handle /api/auth* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-auth:8000' \\"
                - "'    }' \\"
                - "'    handle /api/domain* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-domain:8011' \\"
                - "'    }' \\"
                - "'    handle /api/api-key* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-api-key:8012' \\"
                - "'    }' \\"
                - "'    handle /api/webhook* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-webhook:8013' \\"
                - "'    }' \\"
                - "'    handle /api/contacts* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-contacts:8014' \\"
                - "'    }' \\"
                - "'    handle /api/mail* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-mail:8015' \\"
                - "'    }' \\"
                - "'    handle /api/logs* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-logs:8016' \\"
                - "'    }' \\"
                - "'    handle /api/workflow* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-workflow:8017' \\"
                - "'    }' \\"
                - "'    handle /api/upload* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-upload:8018' \\"
                - "'    }' \\"
                - "'    handle /api/template* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-template:8019' \\"
                - "'    }' \\"
                - "'    handle /api/campaigns* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-campaigns:8027' \\"
                - "'    }' \\"
                - "'    handle /api/inbox* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-inbox:8028' \\"
                - "'    }' \\"
                - "'    handle /api/email* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-email:8022' \\"
                - "'    }' \\"
                - "'    handle /mcp* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-mcp:8029' \\"
                - "'    }' \\"
                - "'    handle /.well-known/oauth-protected-resource* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-mcp:8029' \\"
                - "'    }' \\"
                - "'    handle /.well-known/oauth-authorization-server* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-auth:8000' \\"
                - "'    }' \\"
                - "'    handle /.well-known/openid-configuration* {' \\"
                - "'        reverse_proxy srv-captain--$$cap_appname-auth:8000' \\"
                - "'    }' \\"
                - "'' \\"
                - "'    @removed path /api/credits* /api/tool* /api/admin*' \\"
                - "'    handle @removed {' \\"
                - "'        respond 404' \\"
                - "'    }' \\"
                - "'' \\"
                - "'    handle {' \\"
                - "'        redir /* /dashboard 302' \\"
                - "'    }' \\"
                - "'}' \\"
                - '> /etc/caddy/Caddyfile'
        depends_on:
            - $$cap_appname-dashboard
            - $$cap_appname-links
            - $$cap_appname-auth
    $$cap_appname-postgres:
        image: postgres:17-alpine
        volumes:
            - $$cap_appname-postgres-data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: reloop
            POSTGRES_USER: reloop
            POSTGRES_PASSWORD: $$cap_postgres_password
        caproverExtra:
            notExposeAsWebApp: 'true'
    $$cap_appname-redis:
        image: redis:7-alpine
        command: redis-server --requirepass $$cap_redis_password --appendonly yes --dir /data
        volumes:
            - $$cap_appname-redis-data:/data
        caproverExtra:
            notExposeAsWebApp: 'true'
    $$cap_appname-nats:
        image: nats:2.10-alpine
        command: nats-server -js -sd /data -m 8222
        volumes:
            - $$cap_appname-nats-data:/data
        caproverExtra:
            notExposeAsWebApp: 'true'
    $$cap_appname-auth:
        image: reloopsh/be-auth:$$cap_reloop_version
        command:
            - 'sh'
            - -c
            - 'cd /app/packages/db && /app/node_modules/.bin/drizzle-kit push --force && cd /app && exec bun run dist/index.js'
        volumes:
            - $$cap_appname-setup:/run/reloop
        environment:
            NODE_ENV: production
            BASE_URL: https://$$cap_reloop_domain
            HOST_DOMAIN: $$cap_reloop_domain
            TRACKING_DOMAIN: $$cap_reloop_links_domain
            TRACKING_BASE_URL: https://$$cap_reloop_links_domain
            INBOUND_HOSTNAME: $$cap_reloop_inbound_hostname
            SMTP_HOSTNAME: $$cap_reloop_domain
            AUTH_INTERNAL_BASE_URL: http://srv-captain--$$cap_appname-auth:8000
            PG_URL: postgresql://reloop:$$cap_postgres_password@srv-captain--$$cap_appname-postgres:5432/reloop
            REDIS_URL: redis://:$$cap_redis_password@srv-captain--$$cap_appname-redis:6379
            NATS_URL: nats://srv-captain--$$cap_appname-nats:4222
            BETTER_AUTH_SECRET: $$cap_better_auth_secret
            RELOOP_INTERNAL_SECRET: $$cap_internal_secret
            TRACKING_SECRET: $$cap_tracking_secret
            PREFERENCES_SECRET: $$cap_preferences_secret
            WEBHOOK_ENCRYPTION_KEY: $$cap_webhook_encryption_key
            WORKBENCH_USER: admin
            WORKBENCH_PASS: $$cap_workbench_password
            APP_NAME: $$cap_reloop_app_name
            DISABLE_SIGNUP: 'true'
            DISABLE_ORG_CREATION: 'false'
            DKIM_SELECTOR: reloop
            DNS_RESOLVERS: 8.8.8.8,8.8.4.4
            RELOOP_SENDER_DOMAIN: $$cap_reloop_sender_domain
            SMTP_HOST: $$cap_smtp_host
            SMTP_PORT: $$cap_smtp_port
            SMTP_USER: $$cap_smtp_user
            SMTP_PASSWORD: $$cap_smtp_password
            SMTP_SECURE: $$cap_smtp_secure
            S3_ENDPOINT: $$cap_s3_endpoint
            S3_ACCESS_KEY: $$cap_s3_access_key
            S3_SECRET_KEY: $$cap_s3_secret_key
            S3_BUCKET: $$cap_s3_bucket
            S3_REGION: $$cap_s3_region
            S3_FORCE_PATH_STYLE: 'true'
            KUMOMTA_HTTP_URL: http://srv-captain--$$cap_appname-smtp:8000
            KUMOMTA_WEBHOOK_URL: http://srv-captain--$$cap_appname-domain:8011/api/domain
            KUMOMTA_CHECK_RECIPIENT_URL: http://srv-captain--$$cap_appname-domain:8011/api/domain
            KUMOMTA_RSPAMD_URL: http://srv-captain--$$cap_appname-spam:11333/checkv2
            KUMOMTA_MIN_FREE_SPACE: 5%
            KUMOMTA_MIN_FREE_INODES: '0'
            PORT: '8000'
            SETUP_MODE: 'true'
            ADMIN_SETUP_KEY: $$cap_admin_setup_key
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-postgres
            - $$cap_appname-redis
            - $$cap_appname-nats
