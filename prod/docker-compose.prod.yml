name: reloop

services:
  reloop-postgres:
    image: postgres:17-alpine
    container_name: reloop-postgres
    volumes:
      - reloop-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reloop}
      POSTGRES_USER: ${POSTGRES_USER:-reloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reloop123}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-reloop}", "-d", "${POSTGRES_DB:-reloop}"]
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-redis:
    image: redis:7-alpine
    container_name: reloop-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-reloop123}
    volumes:
      - reloop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-reloop123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: reloop-clickhouse
    volumes:
      - reloop-clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-reloop}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-reloop123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-proxy:
    image: caddy:2-alpine
    container_name: reloop-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - reloop-caddy-data:/data
      - reloop-caddy-config:/config
    restart: unless-stopped
    networks:
      - reloop-network
    depends_on:
      - web
      - dashboard
      - docs

  reloop-kumomta:
    image: ghcr.io/kumocorp/kumomta:latest
    container_name: reloop-kumomta
    ports:
      - "25:25"
    environment:
      - X_KUMOMTA_KEY=${X_KUMOMTA_KEY:-reloop}
      - BASE_URL=https://${DOMAIN}
    volumes:
      - ./kumomta-config.lua:/opt/kumomta/etc/policy/init.lua
    restart: unless-stopped
    networks:
      - reloop-network

  # === Backend Services ===
  auth:
    image: reloopsh/be-auth:latest
    container_name: reloop-auth
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  domain:
    image: reloopsh/be-domain:latest
    container_name: reloop-domain
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  api-key:
    image: reloopsh/be-api-key:latest
    container_name: reloop-api-key
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  webhook:
    image: reloopsh/be-webhook:latest
    container_name: reloop-webhook
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  contacts:
    image: reloopsh/be-contacts:latest
    container_name: reloop-contacts
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  mail:
    image: reloopsh/be-mail:latest
    container_name: reloop-mail
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  logs:
    image: reloopsh/be-logs:latest
    container_name: reloop-logs
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  workflow:
    image: reloopsh/be-workflow:latest
    container_name: reloop-workflow
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  upload:
    image: reloopsh/be-upload:latest
    container_name: reloop-upload
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  template:
    image: reloopsh/be-template:latest
    container_name: reloop-template
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  kumomta-api:
    image: reloopsh/be-kumomta:latest
    container_name: reloop-kumomta-api
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  # === Frontend Services ===
  web:
    image: reloopsh/fe-web:latest
    container_name: reloop-web
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  dashboard:
    image: reloopsh/fe-dashboard:latest
    container_name: reloop-dashboard
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

  docs:
    image: reloopsh/fe-docs:latest
    container_name: reloop-docs
    restart: unless-stopped
    env_file: .env
    networks:
      - reloop-network
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy
      reloop-clickhouse:
        condition: service_healthy

networks:
  reloop-network:
    name: reloop-network

volumes:
  reloop-postgres-data:
  reloop-redis-data:
  reloop-clickhouse-data:
  reloop-caddy-data:
  reloop-caddy-config:
