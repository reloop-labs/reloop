name: reloop

services:
  reloop-postgres:
    image: postgres:alpine
    container_name: reloop-postgres
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-reloop}
      POSTGRES_USER: ${DB_USER:-reloop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reloop123}
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "log_statement=all"]
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      test: ["CMD", "pg_isready", "-U", "reloop", "-d", "reloop"]
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-redis:
    image: redis:alpine
    container_name: reloop-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-reloop123}
    volumes:
      - ./docker-data/redis:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-proxy:
    image: caddy:latest
    container_name: reloop-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./docker-data/caddy:/data
      - ./docker-data/caddy:/config
    restart: unless-stopped
    depends_on:
      - reloop-main
      - reloop-dev
      - reloop-docs
      - reloop-admin
      - reloop-web
    networks:
      - reloop-network

  reloop-rspamd:
    image: rspamd/rspamd:3.7
    container_name: reloop-rspamd
    hostname: rspamd
    depends_on:
      - reloop-postgres
      - reloop-redis
    environment:
      - TZ=${TZ:-UTC}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./docker-data/rspamd:/var/lib/rspamd
      - ./docker-data/rspamd/logs/:/var/log/rspamd
    restart: always
    networks:
      - reloop-network
      - mail-network:
          aliases:
            - rspamd

  reloop-dovecot:
    image: relooplabs/be-dovecot:latest
    container_name: reloop-dovecot
    hostname: dovecot
    depends_on:
      - reloop-rspamd
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./docker-data/dovecot/logs:/var/log/mail
      - ./docker-data/ssl:/etc/ssl/mail
      - ./docker-data/vmail:/var/vmail
      - ./docker-data/rspamd:/var/lib/rspamd
    environment:
      - DB_HOST=${DB_HOST:-reloop-postgres}
      - DB_NAME=${DB_NAME:-reloop}
      - DB_USER=${DB_USER:-reloop}
      - DB_PASSWORD=${DB_PASSWORD:-reloop123}
      - TZ=${TZ:-UTC}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    restart: always
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    networks:
      - reloop-network
      - mail-network:
          aliases:
            - dovecot

  reloop-postfix:
    image: relooplabs/be-postfix:latest
    container_name: reloop-postfix
    hostname: postfix
    depends_on:
      - reloop-dovecot
    volumes:
      - ./docker-data/postfix/logs:/var/log/mail
      - ./docker-data/ssl:/etc/ssl/mail
      - ./docker-data/postfix:/var/spool/postfix
      - ./docker-data/rspamd:/var/lib/rspamd
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOST=${DB_HOST:-reloop-postgres}
      - DB_NAME=${DB_NAME:-reloop}
      - DB_USER=${DB_USER:-reloop}
      - DB_PASSWORD=${DB_PASSWORD:-reloop123}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    restart: always
    networks:
      - reloop-network
      - mail-network:
          aliases:
            - postfix

  reloop-main:
    image: relooplabs/fe-main:latest
    container_name: reloop-main
    ports:
      - "3001:3000"
    depends_on:
      - reloop-postgres
      - reloop-redis
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-dev:
    image: relooplabs/fe-dev:latest
    container_name: reloop-dev
    ports:
      - "3002:3000"
    depends_on:
      - reloop-postgres
      - reloop-redis
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-docs:
    image: relooplabs/fe-docs:latest
    container_name: reloop-docs
    ports:
      - "3003:3000"
    depends_on:
      - reloop-postgres
      - reloop-redis
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-admin:
    image: relooplabs/fe-admin:latest
    container_name: reloop-admin
    ports:
      - "3004:3000"
    depends_on:
      - reloop-postgres
      - reloop-redis
    restart: unless-stopped
    networks:
      - reloop-network

  reloop-web:
    image: relooplabs/fe-web:latest
    container_name: reloop-web
    ports:
      - "3005:3000"
    depends_on:
      - reloop-postgres
      - reloop-redis
    restart: unless-stopped
    networks:
      - reloop-network

networks:
  reloop-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
  mail-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16