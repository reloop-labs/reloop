name: reloop

services:
  reloop-postgres:
    image: postgres:alpine
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: reloop
      POSTGRES_USER: reloop
      POSTGRES_PASSWORD: reloop123
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
    command: ["postgres", "-c", "log_statement=all"]
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      test: ["CMD", "pg_isready", "-U", "reloop", "-d", "reloop"]
    restart: unless-stopped

  reloop-redis:
    image: redis:alpine
    volumes:
      - ./docker-data/redis:/data
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
    restart: unless-stopped
