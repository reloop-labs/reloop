name: reloop

services:
  reloop-postgres:
    image: postgres:alpine
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: reloop
      POSTGRES_USER: reloop
      POSTGRES_PASSWORD: reloop123
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "log_statement=all"]
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      test: ["CMD", "pg_isready", "-U", "reloop", "-d", "reloop"]
    restart: unless-stopped

  reloop-redis:
    image: redis:alpine
    volumes:
      - ./docker-data/redis:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  reloop-proxy:
    image: caddy:latest
    container_name: reloop-proxy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    restart: unless-stopped

  reloop-rspamd:
    image: rspamd/rspamd:3.7
    hostname: rspamd
    depends_on:
      - redis
    environment:
      - TZ=${TZ:-UTC}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./apps/backend/rspamd/config/local.d:/etc/rspamd/local.d
      - ./apps/backend/rspamd/rspamd.conf:/etc/rspamd/rspamd.conf
      - ./apps/backend/rspamd/data:/var/lib/rspamd
      - ./apps/backend/rspamd/logs/:/var/log/rspamd
    restart: always
    networks:
      mail-network:
        aliases:
          - rspamd

  reloop-dovecot:
    build:
      context: ./docker/dovecot
      dockerfile: Dockerfile
    hostname: dovecot
    depends_on:
      - redis
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./apps/backend/dovecot/config/conf.d:/etc/dovecot/conf.d
      - ./apps/backend/dovecot/config/dovecot.conf:/etc/dovecot/dovecot.conf
      - ./apps/backend/dovecot/logs:/var/log/mail
      - ./apps/backend/postfix/data/ssl:/etc/ssl/mail
      - ./apps/backend/dovecot/data/vmail:/var/vmail
      - ./apps/backend/rspamd/data:/var/lib/rspamd
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ:-UTC}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"
      - "${POP_PORT:-110}:110"
      - "${POPS_PORT:-995}:995"
    restart: always
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    networks:
      mail-network:
        aliases:
          - dovecot

  reloop-postfix:
    build:
      context: ./docker/postfix
      dockerfile: Dockerfile
    hostname: postfix
    depends_on:
      - dovecot
      - rspamd
    volumes:
      - ./apps/backend/postfix/config/main.cf:/etc/postfix/main.cf
      - ./apps/backend/postfix/config/master.cf:/etc/postfix/master.cf
      - ./apps/backend/postfix/config/sql:/etc/postfix/sql
      - ./apps/backend/postfix/logs:/var/log/mail
      - ./apps/backend/postfix/ssl:/etc/ssl/mail
      - ./apps/backend/postfix/data:/var/spool/postfix
      - ./apps/backend/rspamd/data:/var/lib/rspamd
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME}
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SMTPS_PORT:-465}:465"
      - "${SUBMISSION_PORT:-587}:587"
    restart: always
    networks:
      mail-network:
        aliases:
          - postfix

networks:
  mail-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16